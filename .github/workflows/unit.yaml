name: Unit Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Install dependencies
        run: pnpm install

      # Run unit tests
      - name: Run SDK unit tests
        run: npx nx run sdk:test
      - name: Run Differ unit tests
        run: npx nx run differ:test
        env:
          NODE_OPTIONS: "--no-experimental-strip-types"
      - name: Run CLI unit tests
        run: npx nx run cli:test
      - name: Run APISIX Backend unit tests
        run: npx nx run backend-apisix:test
      - name: Run API7 Backend unit tests
        run: npx nx run backend-api7:test
      - name: Run OpenAPI Converter unit tests
        run: npx nx run converter-openapi:test
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        run: |
          rustup update stable
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: rust -> target

      - name: Build
        working-directory: ./rust
        run: cargo build --workspace
      - name: Clippy
        working-directory: ./rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Generate differ benchmark fixtures
        working-directory: ./rust
        run: cargo run -p adc-differ --example gen_fixtures
      - name: Run unit tests
        working-directory: ./rust
        run: cargo test --workspace
