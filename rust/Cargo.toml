[workspace]
resolver = "3"
members = [
  "crates/adc-sdk",
  "crates/adc-differ",
  "crates/adc-backend-core",
  "crates/adc-backend-apisix",
  "crates/adc-backend-api7",
  "crates/adc-backend-apisix-standalone",
  "crates/adc-converter-openapi",
  "crates/adc-cli",
]

[workspace.package]
version = "0.30.0"
edition = "2024"
publish = false
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11"
async-trait = "0.1.92"
semver = "1"
thiserror = "2.0.20"
tokio = "1"
log = "0.4.34"
tracing = "0.1"
url = "2"
regex = "1"
schemars = "1"
jsonschema = "0.51.0"
axum = "0.8"
rustls = "0.23"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
serde_yaml_ng = "0.10"
dashmap = "6"
rstest = "0.26.1"
proptest = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
strip = false
panic = "unwind"
