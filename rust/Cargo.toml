[workspace]
resolver = "3"
members = [
  "crates/adc-sdk",
  "crates/adc-differ",
  "crates/adc-backend-core",
  "crates/adc-backend-apisix",
  "crates/adc-sync-bench",
  "crates/adc-mock-server",
  "crates/adc-cli",
]

[workspace.package]
version = "0.29.0"
edition = "2024"
publish = false
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11"
async-trait = "0.1"
semver = "1"
thiserror = "2"
tokio = "1"
log = "0.4"
tracing = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
