packages:
  - apps/*
  - libs/*
autoInstallPeers: false

catalog:
  '@types/lodash-es': ^4.17.12
  '@types/semver': ^7.7.1
  axios: 1.18.1
  datum-diff: 1.0.4
  esbuild: ^0.28.1
  immer: ^11.1.8
  js-yaml: ^5.2.2
  listr2: ^10.0.0
  lodash-es: ^4.18.1
  lru-cache: ^11.0.0
  rxjs: ^7.8.2
  semver: ^7.8.5
  source-map-support: ^0.5.21
  tslib: ^2.8.1
  vitest: ^4.1.9
  '@vitest/coverage-v8': '^4.1.9'
  '@vitest/ui': '^4.1.9'
  zod: ^4.4.3

catalogMode: manual

minimumReleaseAge: 1440
publicHoistPattern:
  - '@types/*'

overrides:
  # NX 22.7.5 pins old versions internally
  axios: '>=1.18.1'
  tmp: '>=0.2.7'
  form-data: '>=4.0.6'
  # @trivago/prettier-plugin-sort-imports requires lodash-es@^4.17.21
  lodash-es: '>=4.17.24'
  # express transitive chain resolves to older versions
  path-to-regexp: '>=8.4.0'
  body-parser: '>=2.2.1'
  qs: '>=6.14.2'
  fast-uri: '>=4.1.1'
  postcss: '>=8.5.18'
  'minimatch@10>brace-expansion': '5.0.8'
  'nx>brace-expansion': '5.0.8'
  # @trivago/prettier-plugin-sort-imports pins minimatch@^9, which requires brace-expansion@^2.x
  # (CJS API, incompatible with 5.x's ESM-first build). 2.1.2 is the latest version on
  # that major line; it patches GHSA-3jxr-9vmj-r5cp but GHSA-mh99-v99m-4gvg's advertised
  # range (<=5.0.7) still flags it since no 2.x release exists past 5.0.8's cutoff.
  # Residual risk is theoretical: this brace-expansion instance only expands glob
  # patterns written by developers in this repo's own prettier config, never
  # attacker-controlled input.
  'minimatch@9>brace-expansion': '2.1.2'

strictPeerDependencies: false
onlyBuiltDependencies:
  - '@parcel/watcher'
  - 'nx'
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true
  less: false
  nx: true
