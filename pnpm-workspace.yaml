packages:
  - apps/*
  - libs/*
autoInstallPeers: false

catalog:
  '@types/lodash-es': ^4.17.12
  '@types/semver': ^7.7.1
  axios: 1.18.1
  datum-diff: 1.0.4
  esbuild: ^0.28.1
  immer: ^11.1.8
  js-yaml: ^5.2.2
  listr2: ^10.0.0
  lodash-es: ^4.18.1
  lru-cache: ^11.0.0
  rxjs: ^7.8.2
  semver: ^7.8.5
  source-map-support: ^0.5.21
  tslib: ^2.8.1
  vitest: ^4.1.9
  '@vitest/coverage-v8': '^4.1.9'
  '@vitest/ui': '^4.1.9'
  zod: ^4.4.3

catalogMode: manual

minimumReleaseAge: 1440
publicHoistPattern:
  - '@types/*'

overrides:
  # NX 22.7.5 pins old versions internally
  axios: '>=1.18.1'
  tmp: '>=0.2.7'
  form-data: '>=4.0.6'
  # @trivago/prettier-plugin-sort-imports requires lodash-es@^4.17.21
  lodash-es: '>=4.17.24'
  # express transitive chain resolves to older versions
  path-to-regexp: '>=8.4.0'
  body-parser: '>=2.2.1'
  qs: '>=6.14.2'
  fast-uri: '>=4.1.2'
  postcss: '>=8.5.18'
  # postcss (via vite/vitest tooling) drags in nanoid<3.3.18, which can loop
  # indefinitely on a zero-size custom generator (GHSA-2v37-7h3g-55p8).
  nanoid: '>=3.3.18'
  'minimatch@10>brace-expansion': '5.0.9'
  'nx>brace-expansion': '5.0.9'
  # @trivago/prettier-plugin-sort-imports pins minimatch@^9, which drags in the
  # unpatched brace-expansion@2.x line (GHSA-mh99-v99m-4gvg). Force it onto minimatch@10
  # instead, which already resolves to the patched brace-expansion@5.0.9.
  '@trivago/prettier-plugin-sort-imports>minimatch': '^10.0.0'

strictPeerDependencies: false
onlyBuiltDependencies:
  - '@parcel/watcher'
  - 'nx'
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true
  less: false
  nx: true
minimumReleaseAgeExclude:
  # Renovate security update: qs@6.16.0
  - qs@6.16.0
